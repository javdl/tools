<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mats de Racer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0d0d1a;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            position: fixed; top: 0; left: 0;
            z-index: 1;
        }
        canvas.interactive { z-index: 10; }
        #input-wrap {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #input-wrap.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            pointer-events: none;
        }
        #prompt-text {
            font-family: 'Patrick Hand', cursive;
            color: rgba(255, 152, 0, 0.8);
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        #name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        #name-input {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            padding: 12px 20px;
            border: 3px solid rgba(255, 109, 0, 0.5);
            border-radius: 30px;
            background: rgba(13, 13, 26, 0.8);
            color: #FF9100;
            text-align: center;
            outline: none;
            width: 260px;
            min-height: 56px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #go-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: 3px solid rgba(255, 109, 0, 0.5);
            background: rgba(13, 13, 26, 0.8);
            color: #FF6D00;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        #go-btn:hover { background: rgba(255, 109, 0, 0.2); transform: scale(1.1); }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="input-wrap">
        <div id="prompt-text">Start de race!</div>
        <div id="name-row">
            <input id="name-input" type="text" value="Mats" readonly autocomplete="off">
            <button id="go-btn" aria-label="Start race">&#x1F3CE;&#xFE0F;</button>
        </div>
    </div>
    <script>
    (function() {
        'use strict';

        var COLORS = ['#FF6D00','#FF9100','#FFAB00','#DD2C00','#FFFFFF','#FFD600','#FF3D00'];
        var MAX_PARTICLES = 500;
        var EXPLOSION_COUNT = 250;
        var BURST_COUNT = 12;
        var STAR_COUNT = 100;

        var state = 'idle';
        var stateTime = 0;
        var nameText = '';
        var msgText = 'De allersnelste racer!';
        var nameAlpha = 0;
        var msgAlpha = 0;
        var mouseX = -9999, mouseY = -9999;
        var mouseActive = false;

        var canvas = document.getElementById('c');
        var ctx = canvas.getContext('2d');
        var dpr = window.devicePixelRatio || 1;
        var W, H, cx, cy;
        var vignetteCanvas = null;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildVignette();
        }

        function buildVignette() {
            vignetteCanvas = document.createElement('canvas');
            vignetteCanvas.width = W * dpr;
            vignetteCanvas.height = H * dpr;
            var vc = vignetteCanvas.getContext('2d');
            vc.setTransform(dpr, 0, 0, dpr, 0, 0);
            var g = vc.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
            g.addColorStop(0, 'rgba(13,13,26,0)');
            g.addColorStop(0.5, 'rgba(13,13,26,0.3)');
            g.addColorStop(1, 'rgba(5,5,15,0.8)');
            vc.fillStyle = g;
            vc.fillRect(0, 0, W, H);
        }

        window.addEventListener('resize', resize);
        resize();

        // Stars (sparks)
        var stars = [];
        for (var i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.5 + 0.3,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 3 + 1
            });
        }

        function drawStars(t) {
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                var alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,200,100,' + alpha + ')';
                ctx.fill();
            }
        }

        // Car shape
        function drawCar(x, y, size, color, alpha, rotation) {
            ctx.save();
            ctx.translate(x, y);
            if (rotation) ctx.rotate(rotation);
            ctx.globalAlpha = alpha;
            var s = size * 0.8;

            // Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-s * 1.4, -s * 0.3, s * 2.8, s * 0.8, s * 0.2);
            ctx.fill();
            // Cabin/windshield
            ctx.beginPath();
            ctx.moveTo(-s * 0.4, -s * 0.3);
            ctx.lineTo(-s * 0.1, -s * 0.8);
            ctx.lineTo(s * 0.7, -s * 0.8);
            ctx.lineTo(s * 0.9, -s * 0.3);
            ctx.fillStyle = 'rgba(100,200,255,0.6)';
            ctx.fill();
            // Wheels
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-s * 0.7, s * 0.5, s * 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.7, s * 0.5, s * 0.35, 0, Math.PI * 2);
            ctx.fill();
            // Wheel centers
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(-s * 0.7, s * 0.5, s * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.7, s * 0.5, s * 0.15, 0, Math.PI * 2);
            ctx.fill();
            // Racing stripe
            ctx.fillStyle = '#fff';
            ctx.fillRect(-s * 1.2, -s * 0.05, s * 2.4, s * 0.12);
            // Spoiler
            ctx.fillStyle = color;
            ctx.fillRect(-s * 1.5, -s * 0.5, s * 0.3, s * 0.3);

            ctx.globalAlpha = 1;
            ctx.restore();
        }

        var particles = [];

        function Particle(x, y, vx, vy, size, color, type) {
            this.x = x; this.y = y;
            this.vx = vx; this.vy = vy;
            this.size = size; this.color = color;
            this.type = type;
            this.alpha = 1; this.life = 1;
            this.decay = type === 'ambient' ? 0.003 + Math.random() * 0.003 : 0;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.04;
            this.orbitAngle = Math.atan2(y - cy, x - cx);
            this.orbitRadius = 0;
            this.targetOrbitRadius = 0;
            this.orbitSpeed = 0;
        }

        function spawnAmbient() {
            if (particles.length >= MAX_PARTICLES) return;
            var side = Math.random() < 0.5;
            var x = side ? -10 : W + 10;
            var y = Math.random() * H;
            var vx = side ? (Math.random() * 3 + 1) : -(Math.random() * 3 + 1);
            var vy = (Math.random() - 0.5) * 0.5;
            var size = Math.random() * 5 + 3;
            var color = COLORS[Math.floor(Math.random() * COLORS.length)];
            particles.push(new Particle(x, y, vx, vy, size, color, 'ambient'));
        }

        function spawnExplosion() {
            for (var i = 0; i < EXPLOSION_COUNT; i++) {
                var angle = Math.random() * Math.PI * 2;
                var speed = Math.random() * 12 + 3;
                var size = Math.random() * 8 + 3;
                var color = COLORS[Math.floor(Math.random() * COLORS.length)];
                var p = new Particle(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed, size, color, 'explosion');
                p.targetOrbitRadius = Math.random() * Math.min(W, H) * 0.35 + 90;
                p.orbitSpeed = (0.5 + Math.random() * 1.5) * (Math.random() < 0.5 ? 1 : -1);
                particles.push(p);
            }
            while (particles.length > MAX_PARTICLES) particles.shift();
        }

        function spawnBurst(bx, by) {
            for (var i = 0; i < BURST_COUNT; i++) {
                if (particles.length >= MAX_PARTICLES) break;
                var angle = Math.random() * Math.PI * 2;
                var speed = Math.random() * 5 + 2;
                var size = Math.random() * 7 + 3;
                var color = COLORS[Math.floor(Math.random() * COLORS.length)];
                var p = new Particle(bx, by, Math.cos(angle) * speed, Math.sin(angle) * speed, size, color, 'explosion');
                p.targetOrbitRadius = Math.random() * Math.min(W, H) * 0.35 + 90;
                p.orbitSpeed = (0.5 + Math.random() * 1.5) * (Math.random() < 0.5 ? 1 : -1);
                particles.push(p);
            }
        }

        function updateParticles(dt) {
            var inGalaxy = (state === 'galaxy' || state === 'message');
            var inExplosion = (state === 'explosion');
            var i = particles.length;
            while (i--) {
                var p = particles[i];
                p.rotation += p.rotSpeed;
                if (p.type === 'ambient') {
                    p.x += p.vx; p.y += p.vy;
                    p.life -= p.decay;
                    p.alpha = Math.max(0, p.life);
                    if (p.life <= 0 || p.x < -30 || p.x > W + 30) { particles.splice(i, 1); continue; }
                } else {
                    if (inExplosion) {
                        p.x += p.vx; p.y += p.vy;
                        p.vx *= 0.97; p.vy *= 0.97;
                        p.orbitAngle = Math.atan2(p.y - cy, p.x - cx);
                        p.orbitRadius = Math.sqrt((p.x - cx) * (p.x - cx) + (p.y - cy) * (p.y - cy));
                    }
                    if (inGalaxy) {
                        var dx = p.x - cx, dy = p.y - cy;
                        p.orbitRadius = Math.sqrt(dx * dx + dy * dy) || 1;
                        p.orbitAngle = Math.atan2(dy, dx);
                        var radialForce = (p.targetOrbitRadius - p.orbitRadius) * 0.02;
                        var angularSpeed = p.orbitSpeed / (p.orbitRadius * 0.01 + 1);
                        p.orbitAngle += angularSpeed * 0.01;
                        var targetX = cx + Math.cos(p.orbitAngle) * (p.orbitRadius + radialForce * 5);
                        var targetY = cy + Math.sin(p.orbitAngle) * (p.orbitRadius + radialForce * 5);
                        p.vx += (targetX - p.x) * 0.05; p.vy += (targetY - p.y) * 0.05;
                        p.vx *= 0.92; p.vy *= 0.92;
                        p.x += p.vx; p.y += p.vy;
                    }
                    if (mouseActive) {
                        var mdx = p.x - mouseX, mdy = p.y - mouseY;
                        var md = Math.sqrt(mdx * mdx + mdy * mdy);
                        if (md < 120 && md > 0) {
                            var force = (120 - md) / 120 * 3;
                            p.vx += (mdx / md) * force; p.vy += (mdy / md) * force;
                        }
                    }
                    p.alpha = 1;
                }
            }
        }

        function drawParticles() {
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                drawCar(p.x, p.y, p.size, p.color, p.alpha, p.rotation);
            }
        }

        function drawBackground() {
            var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
            g.addColorStop(0, '#1a1020');
            g.addColorStop(0.5, '#0d0d1a');
            g.addColorStop(1, '#050510');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
        }

        function drawVignette() {
            if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0, W, H);
        }

        function drawNameAndMessage() {
            if (state !== 'message') return;
            if (nameAlpha > 0.01) {
                ctx.save();
                ctx.font = Math.min(72, W * 0.12) + 'px "Fredoka One", cursive';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,145,0,' + nameAlpha + ')';
                ctx.shadowColor = 'rgba(255,109,0,' + nameAlpha * 0.8 + ')';
                ctx.shadowBlur = 30;
                ctx.fillText(nameText, cx, cy - 20);
                ctx.shadowBlur = 0;
                ctx.restore();
            }
            if (msgAlpha > 0.01) {
                ctx.save();
                ctx.font = Math.min(36, W * 0.06) + 'px "Patrick Hand", cursive';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,214,0,' + msgAlpha * 0.9 + ')';
                ctx.shadowColor = 'rgba(255,214,0,' + msgAlpha * 0.4 + ')';
                ctx.shadowBlur = 20;
                ctx.fillText(msgText, cx, cy + 40);
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        function triggerExplosion() {
            if (state !== 'idle') return;
            nameText = 'Mats';
            document.getElementById('input-wrap').classList.add('hidden');
            canvas.classList.add('interactive');
            particles = particles.filter(function(p) { return p.type !== 'ambient'; });
            state = 'explosion';
            stateTime = 0;
            spawnExplosion();
        }

        var inputEl = document.getElementById('name-input');
        var goBtn = document.getElementById('go-btn');
        inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); triggerExplosion(); } });
        goBtn.addEventListener('click', function(e) { e.preventDefault(); triggerExplosion(); });

        function onPointerMove(px, py) { mouseX = px; mouseY = py; mouseActive = true; }
        canvas.addEventListener('mousemove', function(e) { onPointerMove(e.clientX, e.clientY); });
        canvas.addEventListener('mouseleave', function() { mouseActive = false; });
        canvas.addEventListener('touchmove', function(e) { e.preventDefault(); onPointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        canvas.addEventListener('touchend', function() { mouseActive = false; });
        canvas.addEventListener('click', function(e) { if (state === 'galaxy' || state === 'message') spawnBurst(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', function(e) { if (state === 'galaxy' || state === 'message') spawnBurst(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        function parseHash() {
            var hash = window.location.hash.slice(1);
            if (!hash) return;
            var params = {};
            hash.split('&').forEach(function(part) {
                var kv = part.split('=');
                if (kv.length === 2) params[decodeURIComponent(kv[0].replace(/\+/g, ' '))] = decodeURIComponent(kv[1].replace(/\+/g, ' '));
            });
            if (params.msg) msgText = params.msg;
        }
        parseHash();

        var lastTime = 0, ambientTimer = 0;
        function loop(time) {
            requestAnimationFrame(loop);
            var dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            stateTime += dt;
            if (state === 'explosion' && stateTime > 2.5) { state = 'galaxy'; stateTime = 0; }
            if (state === 'galaxy' && stateTime > 1.0) { state = 'message'; stateTime = 0; }
            if (state === 'message') {
                nameAlpha = Math.min(1, nameAlpha + dt * 0.8);
                if (stateTime > 0.8) msgAlpha = Math.min(1, msgAlpha + dt * 0.6);
            }
            if (state === 'idle') { ambientTimer += dt; if (ambientTimer > 0.3) { ambientTimer = 0; spawnAmbient(); } }
            updateParticles(dt);
            drawBackground();
            drawStars(time * 0.001);
            drawParticles();
            drawVignette();
            drawNameAndMessage();
        }
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
