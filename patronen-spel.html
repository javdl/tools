<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronen Spel</title>
    <style>
        :root {
            --blue: #2563eb;
            --blue-light: #dbeafe;
            --green: #16a34a;
            --green-light: #dcfce7;
            --red: #dc2626;
            --red-light: #fee2e2;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            color: var(--gray-800);
            -webkit-text-size-adjust: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        #game-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        #level-display {
            color: var(--blue);
        }

        #round-display {
            color: var(--gray-600);
        }

        #stars {
            font-size: 1.3rem;
        }

        #houses-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2rem;
            min-height: 120px;
        }

        .house {
            width: 70px;
            height: 80px;
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .house::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 30px solid currentColor;
        }

        .house.blank {
            background: var(--gray-100);
            border: 3px dashed var(--gray-400);
        }

        .house.blank::before {
            border-bottom-color: var(--gray-400);
        }

        .house.correct {
            animation: pop 0.3s ease;
        }

        .house.wrong {
            animation: shake 0.5s ease;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        #houses-container.compact .house {
            width: 55px;
            height: 65px;
        }

        #houses-container.compact .house::before {
            top: -24px;
            border-left-width: 32px;
            border-right-width: 32px;
            border-bottom-width: 24px;
        }

        #color-palette {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.2s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .color-swatch:hover {
            transform: scale(1.05);
        }

        .color-swatch.selected {
            border-color: var(--gray-800);
            border-width: 5px;
            transform: scale(1.1);
        }

        #feedback {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 1rem;
            min-height: 50px;
        }

        #feedback.hidden {
            display: none;
        }

        #feedback.visible {
            animation: pop 0.4s ease;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn.hidden {
            display: none;
        }

        #next-btn {
            display: block;
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.5rem; }
            #game-info { font-size: 1rem; gap: 15px; }
            .house { width: 60px; height: 70px; }
            .house::before {
                top: -25px;
                border-left-width: 35px;
                border-right-width: 35px;
                border-bottom-width: 25px;
            }
            .color-swatch { width: 50px; height: 50px; }
            #houses-container.compact .house { width: 45px; height: 55px; }
            #houses-container.compact .house::before {
                top: -20px;
                border-left-width: 26px;
                border-right-width: 26px;
                border-bottom-width: 20px;
            }
            #feedback { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <h1>Patronen Spel</h1>
    <div id="game-info">
        <span id="level-display">Level 1</span>
        <span id="round-display">Ronde 1</span>
        <span id="stars"></span>
    </div>
    <div id="houses-container"></div>
    <div id="color-palette"></div>
    <div id="feedback" class="hidden"></div>
    <button id="next-btn" class="btn btn-primary hidden">Volgende</button>

    <script>
        const COLORS = {
            red: '#e74c3c',
            blue: '#3498db',
            green: '#2ecc71',
            yellow: '#f1c40f',
            purple: '#9b59b6',
            orange: '#e67e22'
        };

        const PATTERNS = [
            { level: 1, template: ['A', 'B', 'A', 'B', 'A', 'B'], blanks: 2 },
            { level: 2, template: ['A', 'B', 'C', 'A', 'B', 'C'], blanks: 3 },
            { level: 3, template: ['A', 'A', 'B', 'B', 'A', 'A', 'B', 'B'], blanks: 2 },
            { level: 4, template: ['A', 'B', 'B', 'A', 'B', 'B'], blanks: 3 },
            { level: 5, template: ['A', 'B', 'C', 'A', 'B', 'C', 'A', 'B', 'C'], blanks: 3 },
            { level: 6, template: ['A', 'A', 'B', 'C', 'A', 'A', 'B', 'C'], blanks: 3 },
            { level: 7, template: ['A', 'B', 'C', 'D', 'A', 'B', 'C', 'D'], blanks: 4 },
            { level: 8, template: ['A', 'B', 'A', 'C', 'A', 'B', 'A', 'C'], blanks: 4 },
            { level: 9, template: ['A', 'A', 'B', 'B', 'C', 'C', 'A', 'A', 'B', 'B'], blanks: 4 },
            { level: 10, template: ['A', 'B', 'C', 'D', 'E', 'A', 'B', 'C', 'D', 'E'], blanks: 5 }
        ];

        let currentLevel = 1;
        let currentRound = 1;
        let stars = 0;
        let selectedColor = null;
        let currentPattern = null;
        let colorMapping = {};
        let correctAnswers = {};

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function generatePattern() {
            const patternConfig = PATTERNS[currentLevel - 1];
            const template = patternConfig.template;
            const blanks = patternConfig.blanks;

            // Get unique letters in template
            const uniqueLetters = [...new Set(template)];

            // Map each letter to a unique color
            const availableColors = shuffleArray(Object.keys(COLORS));
            colorMapping = {};
            uniqueLetters.forEach((letter, index) => {
                colorMapping[letter] = availableColors[index];
            });

            // Create the pattern with some houses blank
            const pattern = [];
            const blankIndices = [];

            for (let i = 0; i < template.length; i++) {
                if (i >= template.length - blanks) {
                    pattern.push({ letter: template[i], isBlank: true });
                    blankIndices.push(i);
                } else {
                    pattern.push({ letter: template[i], isBlank: false });
                }
            }

            // Store correct answers
            correctAnswers = {};
            blankIndices.forEach(index => {
                correctAnswers[index] = colorMapping[template[index]];
            });

            return pattern;
        }

        function renderHouses() {
            const container = document.getElementById('houses-container');
            container.innerHTML = '';

            if (currentPattern.length > 8) {
                container.classList.add('compact');
            } else {
                container.classList.remove('compact');
            }

            currentPattern.forEach((house, index) => {
                const div = document.createElement('div');
                div.className = house.isBlank ? 'house blank' : 'house';
                div.dataset.index = index;

                if (!house.isBlank) {
                    const color = COLORS[colorMapping[house.letter]];
                    div.style.backgroundColor = color;
                    div.style.color = color;
                }

                if (house.isBlank) {
                    div.dataset.expectedColor = colorMapping[house.letter];
                    div.addEventListener('click', () => handleHouseClick(index));
                }

                container.appendChild(div);
            });
        }

        function renderColorPalette() {
            const palette = document.getElementById('color-palette');
            palette.innerHTML = '';

            // Show all 6 available colors
            Object.keys(COLORS).forEach(colorKey => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = COLORS[colorKey];
                swatch.dataset.color = colorKey;
                swatch.addEventListener('click', () => selectColor(colorKey));
                palette.appendChild(swatch);
            });
        }

        function selectColor(colorKey) {
            selectedColor = colorKey;

            // Update visual selection
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.classList.remove('selected');
            });

            const selectedSwatch = document.querySelector(`[data-color="${colorKey}"]`);
            if (selectedSwatch) {
                selectedSwatch.classList.add('selected');
            }
        }

        function handleHouseClick(index) {
            if (!selectedColor) return;

            const house = document.querySelector(`[data-index="${index}"]`);
            if (!house || !house.classList.contains('blank')) return;

            const correctColor = correctAnswers[index];
            const appliedColor = selectedColor;

            // Apply the color
            house.style.backgroundColor = COLORS[appliedColor];
            house.style.color = COLORS[appliedColor];
            house.classList.remove('blank');

            if (appliedColor === correctColor) {
                // Correct!
                house.classList.add('correct');
                checkRoundCompletion();
            } else {
                // Wrong!
                house.classList.add('wrong');

                setTimeout(() => {
                    house.classList.remove('wrong');
                    // Reset to blank
                    house.classList.add('blank');
                    house.style.backgroundColor = '';
                    house.style.color = '';
                }, 500);
            }
        }

        function checkRoundCompletion() {
            // Count houses that are still blank or wrong (not yet correctly filled)
            const blanksRemaining = document.querySelectorAll('.house.blank').length;
            const wrongHouses = document.querySelectorAll('.house.wrong').length;

            if (blanksRemaining === 0 && wrongHouses === 0) {
                // Round complete! All blanks filled correctly
                showCelebration();
            }
        }

        function showCelebration() {
            const feedback = document.getElementById('feedback');
            feedback.textContent = 'Goed gedaan!';
            feedback.classList.remove('hidden');
            feedback.classList.add('visible');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
        }

        function nextRound() {
            // Hide celebration
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('feedback').classList.remove('visible');
            document.getElementById('next-btn').classList.add('hidden');

            // Clear color selection
            selectedColor = null;
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.classList.remove('selected');
            });

            currentRound++;

            // Check if level is complete (3 rounds)
            if (currentRound > 3) {
                currentRound = 1;
                currentLevel++;
                stars++;

                // Check if game is complete
                if (currentLevel > PATTERNS.length) {
                    // Game complete!
                    updateStars();
                    document.getElementById('feedback').textContent = 'Alle levels voltooid! 🎉';
                    document.getElementById('feedback').classList.remove('hidden');
                    document.getElementById('next-btn').textContent = 'Opnieuw spelen';
                    document.getElementById('next-btn').classList.remove('hidden');
                    document.getElementById('next-btn').onclick = resetGame;
                    return;
                }

                updateStars();
            }

            updateDisplay();
            startNewRound();
        }

        function updateDisplay() {
            document.getElementById('level-display').textContent = `Level ${currentLevel}`;
            document.getElementById('round-display').textContent = `Ronde ${currentRound}`;
        }

        function updateStars() {
            const starsContainer = document.getElementById('stars');
            starsContainer.textContent = '⭐'.repeat(stars);
        }

        function startNewRound() {
            currentPattern = generatePattern();
            renderHouses();
            renderColorPalette();
        }

        function resetGame() {
            currentLevel = 1;
            currentRound = 1;
            stars = 0;
            selectedColor = null;

            updateDisplay();
            updateStars();

            document.getElementById('next-btn').textContent = 'Volgende';
            document.getElementById('next-btn').onclick = nextRound;
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            startNewRound();
        }

        // Initialize game
        document.getElementById('next-btn').addEventListener('click', nextRound);
        startNewRound();
        updateDisplay();
        updateStars();
    </script>
</body>
</html>
